<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My BF</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    height: 100%;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let width = window.innerWidth;
let height = window.innerHeight;
canvas.width = width;
canvas.height = height;

const particleCount = 800;
const particles = [];
const duration = 120000;
const startTime = Date.now();

class Particle {
  constructor(targetX, targetY) {
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    this.targetX = targetX;
    this.targetY = targetY;
    this.size = Math.random() * 1.3 + 0.7;
    this.speed = 0.035 + Math.random() * 0.015;
    this.vx = 0;
    this.vy = 0;
  }

  update(progress) {
    if (progress < 1) {
      const dx = this.targetX - this.x;
      const dy = this.targetY - this.y;
      this.vx += dx * this.speed * 0.012;
      this.vy += dy * this.speed * 0.012;
      this.vx *= 0.94;
      this.vy *= 0.94;
      this.x += this.vx;
      this.y += this.vy;
    }
  }

  draw() {
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#ff1a1a';
    ctx.fillStyle = '#ff2b2b';
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

function generateSolidHeart(count) {
  const points = [];
  const scale = Math.min(width, height) / 32;
  const centerX = width / 2;
  const centerY = height / 2 - scale * 1.5;

  for (let i = 0; i < count; i++) {
    let x, y;
    do {
      x = (Math.random() * 2 - 1) * 16;
      y = (Math.random() * 2 - 1) * 16;
    } while (!isInsideHeart(x, y));

    points.push({
      x: centerX + x * scale,
      y: centerY - y * scale
    });
  }
  return points;
}

function isInsideHeart(x, y) {
  const a = x / 16;
  const b = y / 16;
  return Math.pow(a*a + b*b - 1, 3) - a*a*b <= 0;
}

const points = generateSolidHeart(particleCount);
for (let i = 0; i < particleCount; i++) {
  particles.push(new Particle(points[i].x, points[i].y));
}

function animate() {
  const elapsed = Date.now() - startTime;
  const progress = Math.min(elapsed / duration, 1);

  // Trail effect biar smooth
  ctx.fillStyle = 'rgba(0, 0, 0, 0.18)';
  ctx.fillRect(0, 0, width, height);

  for (let p of particles) {
    p.update(progress);
    p.draw();
  }

  requestAnimationFrame(animate);
}

animate();

window.addEventListener('resize', () => {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;

  const newPoints = generateSolidHeart(particleCount);
  for (let i = 0; i < particles.length; i++) {
    particles[i].targetX = newPoints[i].x;
    particles[i].targetY = newPoints[i].y;
  }
});
</script>
</body>
</html>
