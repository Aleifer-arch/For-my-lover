<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Particles</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    height: 100%;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let width = window.innerWidth;
let height = window.innerHeight;
canvas.width = width;
canvas.height = height;

const particleCount = 800;
const particles = [];
const duration = 120000;
const startTime = Date.now();
let animationDone = false;

class Particle {
  constructor(targetX, targetY) {
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    this.targetX = targetX;
    this.targetY = targetY;
    this.size = Math.random() * 1.5 + 1;
    this.speed = 0.03 + Math.random() * 0.02;
    this.vx = 0;
    this.vy = 0;
    this.glow = Math.random() * 0.5 + 0.5;
  }

  update(progress) {
    if (progress < 1) {
      const dx = this.targetX - this.x;
      const dy = this.targetY - this.y;
      this.vx += dx * this.speed * 0.01;
      this.vy += dy * this.speed * 0.01;
      this.vx *= 0.93;
      this.vy *= 0.93;
      this.x += this.vx;
      this.y += this.vy;
    }
  }

  draw() {
    ctx.shadowBlur = 12 * this.glow;
    ctx.shadowColor = '#ff1a1a';
    ctx.fillStyle = '#ff2b2b';
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

function generateHeartOutline(count) {
  const points = [];
  const scale = Math.min(width, height) / 28;

  for (let i = 0; i < count; i++) {
    const t = (Math.PI * 2 / count) * i;
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);

    const offset = 0.8;
    const rx = x + (Math.random() - 0.5) * offset;
    const ry = y + (Math.random() - 0.5) * offset;

    const canvasX = width / 2 + rx * scale;
    const canvasY = height / 2 - ry * scale;
    points.push({x: canvasX, y: canvasY});
  }
  return points;
}

const points = generateHeartOutline(particleCount);
for (let i = 0; i < particleCount; i++) {
  particles.push(new Particle(points[i].x, points[i].y));
}

function animate() {
  const elapsed = Date.now() - startTime;
  const progress = Math.min(elapsed / duration, 1);

  ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
  ctx.fillRect(0, 0, width, height);

  for (let p of particles) {
    p.update(progress);
    p.draw();
  }

  if (progress >= 1 &&!animationDone) {
    animationDone = true;
  }

  requestAnimationFrame(animate);
}

animate();

window.addEventListener('resize', () => {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;

  const newPoints = generateHeartOutline(particleCount);
  for (let i = 0; i < particles.length; i++) {
    particles[i].targetX = newPoints[i].x;
    particles[i].targetY = newPoints[i].y;
  }
});
</script>
</body>
</html>
