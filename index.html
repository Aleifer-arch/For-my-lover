<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Love Mobile</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    height: 100%;
    touch-action: none;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

let width = canvas.width;
let height = canvas.height;

const particleCount = 600;
const particles = [];
const formDuration = 10000;
const totalDuration = 180000;
const startTime = Date.now();

class Particle {
  constructor(targetX, targetY) {
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    this.targetX = targetX;
    this.targetY = targetY;
    this.size = Math.random() * 1.2 + 0.8;
    this.speed = 0.18 + Math.random() * 0.06;
    this.vx = 0;
    this.vy = 0;
  }
  update(progress) {
    if (progress < 1) {
      const dx = this.targetX - this.x;
      const dy = this.targetY - this.y;
      this.vx += dx * this.speed * 0.04;
      this.vy += dy * this.speed * 0.04;
      this.vx *= 0.82;
      this.vy *= 0.82;
      this.x += this.vx;
      this.y += this.vy;
    }
  }
  draw() {
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#ff1a1a';
    ctx.fillStyle = '#ff2b2b';
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

function generateHeart(count) {
  const points = [];
  const scale = Math.min(width, height) / 28;
  const centerX = width / 2;
  const centerY = height / 2 - scale * 0.5;
  for (let i = 0; i < count; i++) {
    let x, y;
    do {
      x = (Math.random() * 2 - 1) * 16;
      y = (Math.random() * 2 - 1) * 16;
    } while (!isInsideHeart(x, y));
    points.push({
      x: centerX + x * scale,
      y: centerY - y * scale
    });
  }
  return points;
}

function isInsideHeart(x, y) {
  const a = x / 16;
  const b = y / 16;
  return Math.pow(a*a + b*b - 1, 3) - a*a*b <= 0;
}

let points = generateHeart(particleCount);
for (let i = 0; i < particleCount; i++) {
  particles.push(new Particle(points[i].x, points[i].y));
}

function animate() {
  const elapsed = Date.now() - startTime;
  const progress = Math.min(elapsed / formDuration, 1);
  ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
  ctx.fillRect(0, 0, width, height);
  for (let p of particles) {
    p.update(progress);
    p.draw();
  }
  if (elapsed < totalDuration) {
    requestAnimationFrame(animate);
  }
}

animate();

window.addEventListener('resize', () => {
  width = canvas.width;
  height = canvas.height;
  points = generateHeart(particleCount);
  for (let i = 0; i < particles.length; i++) {
    particles[i].targetX = points[i].x;
    particles[i].targetY = points[i].y;
  }
});
</script>
</body>
</html>
