<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Loading Animation</title>
<style>
  body {
    margin: 0;
    background: #0d1117;
    color: #c9d1d9;
    font-family: 'Fira Code', 'Consolas', monospace;
    font-size: 14px;
    overflow: hidden;
  }
  #terminal {
    padding: 20px;
    white-space: pre;
    height: 100vh;
    box-sizing: border-box;
  }
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    display: none;
  }
 .cursor {
    display: inline-block;
    width: 10px;
    background: #c9d1d9;
    animation: blink 1s step-start infinite;
  }
  @keyframes blink {
    50% { opacity: 0; }
  }
</style>
</head>
<body>
<div id="terminal"><span class="cursor"></span></div>
<canvas id="canvas"></canvas>

<script>
const code = `import numpy as np
import matplotlib.pyplot as plt
import matplotlib.animation as animation

def hearta( k ):
    return 15 * np.sin(k)**3

def heartb( k ):
    return 12*np.cos(k) - 5*np.cos(2*k) - 2*np.cos(3*k) - np.cos(4*k)

fig, ax = plt.subplots()
fig.patch.set_facecolor('black')
ax.set_facecolor('black')
ax.set_xlim(-350, 350)
ax.set_ylim(-350, 350)
ax.set_aspect('equal')
ax.axis('off')

total_frames = 600
t = np.linspace(0, 12*np.pi, total_frames)
x_heart = hearta(t) * 20
y_heart = heartb(t) * 20

points, = ax.plot([], [], 'ro', markersize=2)
lines, = ax.plot([], [], 'r-', lw=0.5, alpha=0.3)

def animate(i):
    xi = x_heart[ : i]
    yi = y_heart[ : i]
    x_lines = []
    y_lines = []
    for j in range(i):
        x_lines.extend ( [0, x_heart[j], None])
        y_lines.extend ( [0, y_heart[j], None])
    points.set_data(xi, yi)
    lines.set_data(x_lines, y_lines)
    return points, lines

ani = animation.FuncAnimation(fig, animate, frames=total_frames, interval=10, blit=True, repeat=False)

plt.show( )`;

const terminal = document.getElementById('terminal');
const cursor = document.querySelector('.cursor');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let i = 0;
function typeCode() {
  if (i < code.length) {
    cursor.insertAdjacentText('beforebegin', code[i]);
    i++;
    setTimeout(typeCode, 15);
  } else {
    cursor.remove();
    setTimeout(startHeartParticles, 800);
  }
}

function heartFunc(t) {
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
  return {x: x * 15, y: -y * 15};
}

let particles = [];
let phase = 'heart';

function startHeartParticles() {
  terminal.style.display = 'none';
  canvas.style.display = 'block';

  for (let t = 0; t < Math.PI * 2; t += 0.02) {
    const p = heartFunc(t);
    particles.push({
      x: canvas.width/2 + p.x,
      y: canvas.height/2 + p.y,
      tx: canvas.width/2 + p.x,
      ty: canvas.height/2 + p.y,
      ox: Math.random() * canvas.width,
      oy: Math.random() * canvas.height,
      size: 2,
      color: '#ff4d4d'
    });
  }
  animate();
}

let butterflies = [];
let pollen = [];

function startButterflies() {
  phase = 'butterfly';
  particles = [];
  for (let i = 0; i < 15; i++) {
    butterflies.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      vx: (Math.random() - 0.5) * 2,
      vy: (Math.random() - 0.5) * 2,
      angle: 0
    });
  }
  for (let i = 0; i < 100; i++) {
    pollen.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      vx: (Math.random() - 0.5) * 0.5,
      vy: (Math.random() - 0.5) * 0.5,
      alpha: Math.random()
    });
  }
}

let frame = 0;
function animate() {
  ctx.fillStyle = 'rgba(13, 17, 23, 0.2)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (phase === 'heart') {
    particles.forEach(p => {
      p.x += (p.tx - p.x) * 0.05;
      p.y += (p.ty - p.y) * 0.05;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });
    frame++;
    if (frame > 180) startButterflies();
  }

  if (phase === 'butterfly') {
    pollen.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
      if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
      ctx.fillStyle = `rgba(255, 215, 0, ${p.alpha})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 1.5, 0, Math.PI * 2);
      ctx.fill();
    });

    butterflies.forEach(b => {
      b.x += b.vx;
      b.y += b.vy;
      b.angle += 0.1;
      if (b.x < 0 || b.x > canvas.width) b.vx *= -1;
      if (b.y < 0 || b.y > canvas.height) b.vy *= -1;

      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.angle);
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(-8, 0, 6, 12, 0, 0, Math.PI * 2);
      ctx.ellipse(8, 0, 6, 12, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });
  }

  requestAnimationFrame(animate);
}

window.onload = () => typeCode();
window.onresize = () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
};
</script>
</body>
</html>
