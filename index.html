<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfect Love Particles</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    height: 100%;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let width = window.innerWidth;
let height = window.innerHeight;
canvas.width = width;
canvas.height = height;

const particleCount = 800;
const particles = [];
const formDuration = 20000;
const totalDuration = 180000;
const startTime = Date.now();

class Particle {
  constructor(targetX, targetY) {
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    this.targetX = targetX;
    this.targetY = targetY;
    this.size = Math.random() * 1.4 + 0.6;
    this.speed = 0.12 + Math.random() * 0.03;
    this.vx = 0;
    this.vy = 0;
  }

  update(progress) {
    if (progress < 1) {
      const dx = this.targetX - this.x;
      const dy = this.targetY - this.y;
      this.vx += dx * this.speed * 0.03;
      this.vy += dy * this.speed * 0.03;
      this.vx *= 0.86;
      this.vy *= 0.86;
      this.x += this.vx;
      this.y += this.vy;
    }
  }

  draw() {
    ctx.shadowBlur = 12;
    ctx.shadowColor = '#ff1a1a';
    ctx.fillStyle = '#ff2b2b';
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

function generatePerfectHeart(count) {
  const points = [];
  const scale = Math.min(width, height) / 33;
  const centerX = width / 2;
  const centerY = height / 2 - scale * 1.2;

  for (let i = 0; i < count; i++) {
    let x, y;
    do {
      x = (Math.random() * 2 - 1) * 15;
      y = (Math.random() * 2 - 1) * 15;
    } while (!isInsideHeart(x, y));

    points.push({
      x: centerX + x * scale,
      y: centerY - y * scale
    });
  }
  return points;
}

function isInsideHeart(x, y) {
  const a = x / 15;
  const b = y / 15;
  return Math.pow(a*a + b*b - 1, 3) - a*a*b <= 0;
}

// Init
const points = generatePerfectHeart(particleCount);
for (let i = 0; i < particleCount; i++) {
  particles.push(new Particle(points[i].x, points[i].y));
}

function animate() {
  const elapsed = Date.now() - startTime;
  const progress = Math.min(elapsed / formDuration, 1);

  ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
  ctx.fillRect(0, 0, width, height);

  for (let p of particles) {
    p.update(progress);
    p.draw();
  }

  if (elapsed < totalDuration) {
    requestAnimationFrame(animate);
  }
}

animate();

window.addEventListener('resize', () => {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width;
  canvas.height = height;

  const newPoints = generatePerfectHeart(particleCount);
  for (let i = 0; i < particles.length; i++) {
    particles[i].targetX = newPoints[i].x;
    particles[i].targetY = newPoints[i].y;
  }
});
</script>
</body>
</html>
