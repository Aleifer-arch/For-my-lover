<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Loading - Xaephierra</title>
<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #000;
    overflow: hidden;
    font-family: 'Consolas', 'Monospace';
  }

  #loading-screen {
    position: fixed;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #000;
    z-index: 9999;
    transition: opacity 1s ease-out;
  }

  #code-display {
    color: #ff7b72;
    font-size: 14px;
    text-align: left;
    max-width: 90%;
    max-height: 80vh;
    overflow: hidden;
    white-space: pre-wrap;
    transition: opacity 1s ease-out;
  }

  #heart-container {
    display: none;
    flex-direction: column;
    align-items: center;
  }

  canvas {
    display: block;
  }

.loading-text {
    color: #ff2d55;
    font-size: 20px;
    margin-top: 20px;
    letter-spacing: 3px;
    animation: blink 1.2s infinite;
    font-family: 'Segoe UI', sans-serif;
    font-weight: 600;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

.keyword { color: #ff7b72; }
.function { color: #d2a8ff; }
.string { color: #a5d6ff; }
.number { color: #79c0ff; }
.comment { color: #8d96a0; }
.builtin { color: #ffa657; }
</style>
</head>
<body>

<div id="loading-screen">
  <pre id="code-display"></pre>

  <div id="heart-container">
    <canvas id="heartCanvas"></canvas>
    <div class="loading-text">Loading...</div>
  </div>
</div>

<script>
const code = `import numpy as np
import matplotlib.pyplot as plt
import matplotlib.animation as animation

def hearta( k ):
    return 15 * np.sin(k)**3

def heartb( k ):
    return 12*np.cos(k) - 5*np.cos(2*k) - 2*np.cos(3*k) - np.cos(4*k)

fig, ax = plt.subplots()
fig.patch.set_facecolor('black')
ax.set_facecolor('black')
ax.set_xlim(-350, 350)
ax.set_ylim(-350, 350)
ax.set_aspect('equal')
ax.axis('off')`;

const codeDisplay = document.getElementById('code-display');
let i = 0;
const typingSpeed = 20;

function highlightCode(code) {
  return code
  .replace(/(\#.*)/g, '<span class="comment">$1</span>')
  .replace(/\b(def|import|return|for|in|if|from|as)\b/g, '<span class="keyword">$1</span>')
  .replace(/\b(np|plt|animation|fig|ax)\b/g, '<span class="builtin">$1</span>')
  .replace(/\b(hearta|heartb|animate)\b/g, '<span class="function">$1</span>')
  .replace(/('[^']*')/g, '<span class="string">$1</span>')
  .replace(/\b(\d+)\b/g, '<span class="number">$1</span>');
}

function typeCode() {
  if (i < code.length) {
    const currentCode = code.substring(0, i + 1);
    codeDisplay.innerHTML = highlightCode(currentCode);
    i++;
    setTimeout(typeCode, typingSpeed);
  } else {
    setTimeout(showButterflyAnimation, 1500);
  }
}

function showButterflyAnimation() {
  document.getElementById('code-display').style.opacity = '0';
  setTimeout(() => {
    document.getElementById('code-display').style.display = 'none';
    document.getElementById('heart-container').style.display = 'flex';
    startButterflyAnimation();
  }, 1000);
}

const canvas = document.getElementById('heartCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let frame = 0;
let animationPhase = 'butterfly';
let butterflies = [];
let heartParticles = [];

function heartX(t) {
  return 16 * Math.pow(Math.sin(t), 3);
}

function heartY(t) {
  return 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
}

for (let i = 0; i < 1200; i++) {
  let t = (i / 1200) * 2 * Math.PI;
  let x = heartX(t) * 18 + canvas.width / 2;
  let y = -heartY(t) * 18 + canvas.height / 2;
  
  heartParticles.push({
    x: x,
    y: y,
    originX: x,
    originY: y,
    vx: (Math.random() - 0.5) * 8,
    vy: (Math.random() - 0.5) * 8,
    size: Math.random() * 2 + 0.5,
    alpha: 0,
    pulse: Math.random() * Math.PI * 2
  });
}

for (let i = 0; i < 55; i++) {
  butterflies.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    vx: (Math.random() - 0.5) * 10,
    vy: (Math.random() - 0.5) * 10,
    angle: Math.random() * Math.PI * 2,
    wingPhase: Math.random() * Math.PI * 2,
    size: 5 + Math.random() * 3,
    pollen: []
  });
}

function drawButterfly(b, alpha) {
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.rotate(b.angle);
  ctx.globalAlpha = alpha;

  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.ellipse(-b.size/2, 0, b.size, b.size*0.7, -0.3, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.ellipse(b.size/2, 0, b.size, b.size*0.7, 0.3, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#e0e0e0';
  ctx.beginPath();
  ctx.ellipse(0, 0, b.size*0.2, b.size*0.5, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
  ctx.beginPath();
  ctx.ellipse(-b.size/2, 0, b.size*0.8, b.size*0.5, -0.3 + Math.sin(b.wingPhase) * 0.7, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(b.size/2, 0, b.size*0.8, b.size*0.5, 0.3 - Math.sin(b.wingPhase) * 0.7, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();

  if (Math.random() < 0.3) {
    b.pollen.push({
      x: b.x + (Math.random() - 0.5) * 12,
      y: b.y + (Math.random() - 0.5) * 12,
      life: 25
    });
  }
}

function drawPollen() {
  butterflies.forEach(b => {
    b.pollen = b.pollen.filter(p => {
      p.life--;
      p.y += 1;
      const alpha = p.life / 25;
      ctx.fillStyle = `rgba(255, 215, 0, ${alpha})`;
      ctx.shadowBlur = 12;
      ctx.shadowColor = '#ffd700';
      ctx.beginPath();
      ctx.arc(p.x, p.y, 1.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      return p.life > 0;
    });
  });
}

function startButterflyAnimation() {
  frame = 0;
  animate();
}

function animate() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (animationPhase === 'butterfly') {
    frame++;
    drawPollen();

    butterflies.forEach(b => {
      b.x += b.vx;
      b.y += b.vy;
      b.vx += (Math.random() - 0.5) * 0.6;
      b.vy += (Math.random() - 0.5) * 0.6;
      b.angle += 0.1;
      b.wingPhase += 0.5;

      if (b.x < -50 || b.x > canvas.width + 50) b.vx *= -1;
      if (b.y < -50 || b.y > canvas.height + 50) b.vy *= -1;

      drawButterfly(b, 1);
    });

    if (frame >= 400) {
      animationPhase = 'heart';
      frame = 0;
    }

    requestAnimationFrame(animate);
  }

  else if (animationPhase === 'heart') {
    frame++;

    ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (frame < 40) {
      const burstProgress = frame / 40;
      
      heartParticles.forEach(p => {
        const distance = burstProgress * (1 + Math.random() * 0.5);
        p.x = p.originX + p.vx * distance * 40;
        p.y = p.originY + p.vy * distance * 40;
        p.alpha = Math.min(burstProgress * 2, 1);
      });
    }
    
    heartParticles.forEach(p => {
      p.pulse += 0.1;
      
      const floatX = Math.sin(p.pulse) * 3;
      const floatY = Math.cos(p.pulse * 0.8) * 3;
      
      const finalX = p.x + floatX;
      const finalY = p.y + floatY;
      
      ctx.shadowBlur = 20;
      ctx.shadowColor = '#ff0000';
      ctx.fillStyle = `rgba(255, ${Math.random() * 50}, ${Math.random() * 50}, ${p.alpha})`;
      
      ctx.beginPath();
      ctx.arc(finalX, finalY, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    });

    requestAnimationFrame(animate);
  }
}

function hideLoading() {
  document.getElementById('loading-screen').style.opacity = '0';
  setTimeout(() => {
    document.getElementById('loading-screen').style.display = 'none';
  }, 1000);
}

typeCode();

window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  heartParticles = [];
  for (let i = 0; i < 1200; i++) {
    let t = (i / 1200) * 2 * Math.PI;
    let x = heartX(t) * 18 + canvas.width / 2;
    let y = -heartY(t) * 18 + canvas.height / 2;
    
    heartParticles.push({
      x: x,
      y: y,
      originX: x,
      originY: y,
      vx: (Math.random() - 0.5) * 8,
      vy: (Math.random() - 0.5) * 8,
      size: Math.random() * 2 + 0.5,
      alpha: 1,
      pulse: Math.random() * Math.PI * 2
    });
  }
});
</script>

</body>
</html>
